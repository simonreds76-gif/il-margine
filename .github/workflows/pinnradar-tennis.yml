name: Private tennis feed entitlement check
on: workflow_dispatch
permissions: {}
jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read plan and expiry from provider dashboard
        env:
          PINNRADAR_KEY: ${{ secrets.PINNRADAR_KEY }}
        shell: python
        run: |
          import json, os, re, urllib.error, urllib.request
          from datetime import datetime, timezone
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          req=urllib.request.Request("https://pinnradar.com/panel/api/me",
              headers={"x-portal-apikey":os.environ["PINNRADAR_KEY"],"Accept":"application/json"})
          try:
              with urllib.request.build_opener(NoRedirect).open(req,timeout=15) as resp:
                  data=json.load(resp)
          except urllib.error.HTTPError as exc:
              raise RuntimeError("Dashboard returned HTTP "+str(exc.code)) from None
          def iso(v):
              if isinstance(v,(int,float)) and not isinstance(v,bool) and 1e9 <= v < 1e14:
                  return datetime.fromtimestamp(v/(1000 if v > 1e11 else 1),timezone.utc).isoformat()
              if isinstance(v,str) and re.fullmatch(r"20\d\d-\d\d-\d\d(?:T[\d:.+Z-]+)?",v): return v
              return None
          plan=data.get("plan") or {}
          addon=data.get("ws_addon") or {}
          kind=plan.get("id")
          receipt={"at":datetime.now(timezone.utc).isoformat(),
              "plan":kind if kind in ("free","edge","rest","scale","drops","trial","demo","trial_3d","demo_3d") else "other",
              "limits":{k:v for k,v in (plan.get("limits") or {}).items() if re.fullmatch(r"[a-zA-Z_]{1,25}",k) and type(v) in (int,float)},
              "planExpires":iso(data.get("plan_expires_at")), "streamActive":addon.get("active") is True, "streamUntil":iso(addon.get("until"))}
          print("ACCOUNT_EVIDENCE "+json.dumps(receipt))
