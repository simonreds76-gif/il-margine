name: Private tennis feed entitlement check
on: workflow_dispatch
permissions: {}
jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm plan and expiry with the provider
        env:
          PINNRADAR_KEY: ${{ secrets.PINNRADAR_KEY }}
        shell: python
        run: |
          import json, os, re, urllib.error, urllib.request
          from datetime import datetime, timezone
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          opener = urllib.request.build_opener(NoRedirect)
          key = os.environ["PINNRADAR_KEY"]
          def call(body):
              req = urllib.request.Request("https://mcp.pinnradar.com/mcp", data=json.dumps(body).encode(),
                  headers={"Authorization": "Bearer "+key, "Content-Type":"application/json",
                           "Accept":"application/json, text/event-stream","MCP-Protocol-Version":"2025-03-26"})
              try:
                  with opener.open(req,timeout=15) as response:
                      raw=response.read(65536).decode()
              except urllib.error.HTTPError as e:
                  raise RuntimeError("Account endpoint HTTP "+str(e.code)) from None
              if raw.lstrip().startswith("{"):
                  return json.loads(raw)
              events=[json.loads(s[5:].strip()) for s in raw.splitlines() if s.startswith("data:") and s[5:].strip().startswith("{")]
              return next((e for e in events if e.get("id")==body["id"]),{})
          doc=call({"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"my_usage","arguments":{}}})
          result=doc.get("result",{})
          if "error" in doc or result.get("isError") or not result:
              raise RuntimeError("Provider did not return account entitlement information")
          # Emit only plan words, timestamps, and numeric limits. Never print provider response bodies.
          items={}
          def visit(v, label="account"):
              if isinstance(v,dict):
                  for k, value in v.items():
                      if re.fullmatch(r"[A-Za-z_]{1,40}",str(k)) and not re.search(r"key|token|mail|user|client|secret|url|billing|identity",str(k),re.I):
                          visit(value,label+"."+k)
              elif isinstance(v,list):
                  for value in v: visit(value,label)
              elif isinstance(v,str):
                  if v.lstrip().startswith(("{","[")):
                      try: visit(json.loads(v),label); return
                      except ValueError: pass
                  terms=re.findall(r"\b(?:free|demo|trial|edge|scale|drops|REST)\b",v,re.I)
                  dates=re.findall(r"\b20\d\d-\d\d-\d\d(?:[ T]\d\d:\d\d(?::\d\d(?:\.\d{1,6})?)?(?:Z|[+-]\d\d:\d\d)?)?",v)
                  if terms or dates: items[label]=dict(terms=terms,dates=dates)
              elif isinstance(v,(int,float)) and re.search(r"limit|remaining|requests|usage|demo|expiry|rate",label,re.I):
                  items[label]=v
          visit(result)
          print("ACCOUNT_EVIDENCE "+json.dumps({"observed":datetime.now(timezone.utc).isoformat(),"fields":items}))
