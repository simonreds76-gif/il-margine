name: Private tennis price moves
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [codex/pinnradar-tennis-15m-20261119]
    paths: ['scripts/pinnradar_tennis.py', 'scripts/tests/test_pinnradar_tennis.py', '.github/workflows/pinnradar-tennis.yml']
permissions:
  contents: read
concurrency:
  group: pinnradar-tennis-private
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/pinnradar_tennis.py
            /scripts/tests/test_pinnradar_tennis.py
      - name: Install HTTP client
        run: python -m pip install --quiet requests
      - name: Check fixture and price matching
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s scripts/tests -p 'test_pinnradar_tennis.py'
      - name: Save a private pre-match snapshot
        env:
          VERIFY_PRIVATE_SNAPSHOT: ${{ github.event_name != 'schedule' && 'true' || 'false' }}
          PINNRADAR_KEY: ${{ secrets.PINNRADAR_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/pinnradar_tennis.py
