name: Private tennis REST diagnostic
on: workflow_dispatch
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: python -m pip install --quiet requests
      - name: Check one tennis response without storing odds
        env:
          TENNIS_KEY: ${{ secrets.PINNRADAR_KEY }}
        shell: python
        run: |
          import json
          import os
          import requests

          key = os.environ["TENNIS_KEY"]
          if not key:
              raise SystemExit("Repository secret unavailable")
          with requests.get("https://pinnradar.com/kit/v1/prematch/fixtures", params={"sport_id": 2},
                            headers={"x-portal-apikey": key}, allow_redirects=False, timeout=25) as response:
              print("Tennis REST HTTP", response.status_code, flush=True)
              if response.status_code == 200:
                  data = response.json()
                  events = data.get("events")
                  print("Returned events:", len(events) if isinstance(events, list) else "invalid shape")
              else:
                  raw = response.content[:8192].decode("utf-8", "replace").lower()
                  labels = ("missing_key", "invalid_key", "invalid api key", "unknown key", "disabled", "expired",
                            "suspended", "revoked", "quota", "rate_limit", "unauthorized", "forbidden",
                            "verify", "blocked", "subscription", "ip address", "access denied", "cloudflare",
                            "inactive", "trial", "limit reached", "payment", "free plan")
                  print("Recognised response labels:", [label for label in labels if label in raw])
                  print("JSON response:", "json" in response.headers.get("Content-Type", ""))
              print("Diagnostic complete; no production state or messages written")
