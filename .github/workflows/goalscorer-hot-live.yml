name: Paddy Read-only Cloud Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/probe-paddy-cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: paddy-cloud-probe
          path: paddy-cloud-probe.json
