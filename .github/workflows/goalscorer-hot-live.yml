name: Goalscorer Hot Live Poll

on:
  schedule:
    # :10 is the full price/close poll. :40 refreshes lineups only, giving the
    # public board a 30-minute XI cadence without extra Odds-API or DB usage.
    - cron: "10 10-22 * * *"
    - cron: "40 10-22 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this hosted hot-live poll was triggered"
        type: string
        required: false
      penalty_only:
        description: "Recover penalty reviews without refreshing any model prices"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: golden-with-speed-insights-branch-writes
  cancel-in-progress: false

jobs:
  live-poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Create .env.local
        run: |
          : > .env.local
          if [ -n "${{ secrets.ODDS_API_KEY }}" ]; then
            echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
            echo "ODDS_API_IO_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
          fi
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          else
            echo "NEXT_PUBLIC_SUPABASE_URL=https://nuqcgzbagxtbxlqrhtvc.supabase.co" >> .env.local
          fi
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          fi
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.local
          elif [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL=${{ secrets.SUPABASE_DB_URL }}" >> .env.local
          fi

      - uses: actions/checkout@v5
        if: always() && !cancelled()
        with:
          ref: ${{ github.sha }}
          path: .penalty-hot-tools
          sparse-checkout: |
            scripts/penalty_review_hot.py
            scripts/tests/test_penalty_review_hot.py
          sparse-checkout-cone-mode: false

      - name: Check completed matches for penalty reviews independently
        id: penalty_capture
        continue-on-error: true
        if: always() && !cancelled()
        run: |
          python -m unittest discover -s .penalty-hot-tools/scripts/tests -p test_penalty_review_hot.py
          python .penalty-hot-tools/scripts/penalty_review_hot.py

      - name: Persist penalty capture before notification
        id: penalty_capture_save
        continue-on-error: true
        if: steps.penalty_capture.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/goalscorer/penalty-hot-capture-state.json
          git add -f data/goalscorer/*penalty-duty-live-review.json data/goalscorer/*penalty-duty-live-review.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: penalty coverage ledger and verified match evidence"
            bash scripts/ci-safe-push.sh golden-with-speed-insights
          fi

      - name: Send only new actionable penalty reviews
        id: penalty_notify
        continue-on-error: true
        if: steps.penalty_capture_save.outcome == 'success'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPS_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_ALERT_TELEGRAM_BOT_TOKEN }}
          OPS_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.OPS_ALERT_TELEGRAM_CHAT_ID }}
          PENALTY_REVIEW_URL: https://ilmargine.bet/model-monitor/goalscorer#penalty-watchlist
        run: python .penalty-hot-tools/scripts/penalty_review_hot.py --notify

      - name: Persist successful notification batches even if a later batch failed
        id: penalty_delivery_save
        continue-on-error: true
        if: always() && !cancelled() && steps.penalty_capture_save.outcome == 'success'
        run: |
          git add -f data/goalscorer/club-penalty-alert-state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: retain completed penalty notification receipts"
            bash scripts/ci-safe-push.sh golden-with-speed-insights
          fi

      - name: Run hosted hot live poll
        if: github.event_name != 'workflow_dispatch' || !inputs.penalty_only
        env:
          ASSIST_VALUE_SHADOW_ENABLED: ${{ vars.ASSIST_VALUE_SHADOW_ENABLED }}
          GOALSCORER_LINEUP_ONLY: ${{ github.event.schedule == '40 10-22 * * *' && '1' || '0' }}
          GOALSCORER_FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/goalscorer-live-hosted.py

      - name: Build goalscorer monitor snapshot
        run: |
          python scripts/build-goalscorer-monitor-snapshot.py
          if [ "${{ inputs.penalty_only }}" = "true" ]; then exit 0; fi
          python scripts/build-football-form-layer.py --output-dir "${RUNNER_TEMP}/football-form" --skip-validation
          python scripts/generate-fair-odds-lab.py --team-match-base "${RUNNER_TEMP}/football-form/team-match-base.csv"
          python scripts/generate-fair-odds-lab-highlights.py
          python scripts/validate-fair-odds-lab-highlights.py

      - name: Upload Fair Odds Lab artifacts to Vercel Blob
        if: github.event_name != 'workflow_dispatch' || !inputs.penalty_only
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            python -m pip install -r scripts/requirements-blob.txt
          fi
          python scripts/upload-fair-odds-lab-blob.py

      - name: Private Air Control player watchlist
        if: github.event_name != 'workflow_dispatch' || !inputs.penalty_only
        continue-on-error: true
        env:
          OPS_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_ALERT_TELEGRAM_BOT_TOKEN }}
          OPS_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.OPS_ALERT_TELEGRAM_CHAT_ID }}
        run: |
          python -m unittest discover -s scripts/tests -p test_aerial_alerts.py
          python scripts/aerial_alerts.py --send

      - name: Upload goalscorer monitor snapshot
        if: github.event.schedule != '40 10-22 * * *'
        env:
          ENABLE_SUPABASE_SNAPSHOT_UPLOADS: ${{ vars.ENABLE_SUPABASE_SNAPSHOT_UPLOADS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${ENABLE_SUPABASE_SNAPSHOT_UPLOADS:-0}" = "1" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            # The snapshot was already built above. Rebuilding then comparing
            # against that local file can skip an update never uploaded to Admin.
            python - <<'PY'
          import runpy, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          module = runpy.run_path('scripts/build-goalscorer-monitor-snapshot.py')
          payload = module['read_existing_snapshot'](module['OUTPUT_PATH'])
          if not payload or not payload.get('generated_at'):
              raise SystemExit('Built monitor snapshot missing; existing hosted snapshot retained')
          module['upload_snapshot'](module['DEFAULT_SNAPSHOT_KEY'], payload)
          print('Uploaded the already-built monitor snapshot to Admin')
          PY
          else
            echo "::warning::Supabase snapshot upload disabled or key missing; skipping monitor snapshot upload."
          fi

      - name: Commit and push if new data
        env:
          ASSIST_VALUE_SHADOW_ENABLED: ${{ vars.ASSIST_VALUE_SHADOW_ENABLED }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/git-add-goalscorer-deploy-artifacts.sh
          git add -f data/goalscorer/penalty-hot-capture-state.json
          if [ "${ASSIST_VALUE_SHADOW_ENABLED:-0}" = "1" ]; then
            git add -f \
              data/assist-value/assist-value-shadow-signals.csv \
              data/assist-value/assist-value-model-report.txt \
              data/assist-value/research/assist-value-v1-prospective.csv 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "No goalscorer live changes to commit."
            exit 0
          fi
          git commit -m "chore: hosted goalscorer hot live poll"
          bash scripts/ci-safe-push.sh golden-with-speed-insights

      - name: Surface penalty failures after independent pricing work
        if: always() && !cancelled()
        env:
          CAPTURE: ${{ steps.penalty_capture.outcome }}
          CAPTURE_SAVE: ${{ steps.penalty_capture_save.outcome }}
          NOTIFY: ${{ steps.penalty_notify.outcome }}
          DELIVERY_SAVE: ${{ steps.penalty_delivery_save.outcome }}
        run: |
          for outcome in "$CAPTURE" "$CAPTURE_SAVE" "$NOTIFY" "$DELIVERY_SAVE"; do
            if [ "$outcome" != "success" ]; then
              echo "::error::Penalty processing did not complete; pricing was allowed to run independently."
              exit 1
            fi
          done
          python .penalty-hot-tools/scripts/penalty_review_hot.py --check-health
