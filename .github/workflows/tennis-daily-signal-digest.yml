name: Tennis Daily Signal Digest
run-name: tennis-delivery-${{ inputs.delivery_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: Base64-encoded JSON array of Telegram messages
        required: true
        type: string

      delivery_id:
        description: Durable local outbox identifier
        required: false
        type: string

      verification_only:
        description: Run delivery and identity tests without Telegram
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: tennis-daily-signal-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DIGEST_PAYLOAD_B64: ${{ inputs.payload_b64 }}
      OPS_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_ALERT_TELEGRAM_BOT_TOKEN }}
      OPS_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.OPS_ALERT_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/tennis_telegram_delivery.py
            scripts/tennis_digest_relay.py
            scripts/tennis_paper_quote_identity.py
            scripts/tennis_price_identity.py
            scripts/tests/test_tennis_delivery_receipts.py
            scripts/tests/test_tennis_paper_quote_identity.py
          sparse-checkout-cone-mode: false
      - name: Verify delivery and quote identity without sending
        if: inputs.verification_only
        run: |
          python -B -m unittest discover -s scripts/tests -p test_tennis_delivery_receipts.py
          python -B -m unittest discover -s scripts/tests -p test_tennis_paper_quote_identity.py
      - name: Send private tennis digest with delivery receipts
        if: ${{ !inputs.verification_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/tennis_telegram_delivery.py
      - name: Preserve per-message delivery acknowledgement
        if: ${{ always() && !inputs.verification_only }}
        uses: actions/upload-artifact@v4
        with:
          name: tennis-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: telegram-delivery-receipt.json
          retention-days: 14
          if-no-files-found: warn
