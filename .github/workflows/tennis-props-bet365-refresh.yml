name: Tennis Props Bet365 Refresh

on:
  schedule:
    - cron: "25 8 * * *"
    # GitHub occasionally delays or drops a scheduled run. This fallback is
    # credit-safe: it only scrapes when the morning capture has no usable rows.
    - cron: "25 11 * * *"
    - cron: "25 15 * * *"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "How many days ahead to scan"
        type: number
        default: 2
      max_events:
        description: "Maximum tennis events to query"
        type: number
        default: 64
      commit_results:
        description: "Commit captured odds files back to the branch"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tennis-props-bet365-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Create .env.local
        run: |
          : > .env.local
          if [ -n "${{ secrets.ODDS_API_KEY }}" ]; then
            echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
            echo "ODDS_API_IO_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
          fi

      - name: Guard fallback API credits
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '25 11 * * *' }}
        id: fallback_guard
        shell: bash
        run: |
          TODAY="$(date -u +%F)"
          LINES_FILE="data/tennis-props/inbox/bet365-lines-${TODAY}.csv"
          if [ -s "${LINES_FILE}" ] && [ "$(wc -l < "${LINES_FILE}")" -gt 1 ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Morning capture already has usable rows; skipping fallback API call."
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "No usable morning capture found; running fallback API call."
          fi

      - name: Scrape Bet365 tennis player props
        if: ${{ steps.fallback_guard.outputs.skip != 'true' }}
        env:
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '2' }}
          MAX_EVENTS: ${{ github.event.inputs.max_events || '64' }}
        run: |
          python scripts/tennis-props-scrape-bet365.py \
            --date "$(date -u +%F)" \
            --days-ahead "${DAYS_AHEAD}" \
            --max-events "${MAX_EVENTS}" \
            --bookmakers "Bet365"

      - name: Upload captured odds artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennis-props-bet365-${{ github.run_id }}
          path: |
            data/tennis-props/inbox/bet365-lines-*.csv
            data/tennis-props/inbox/bet365-tennis-market-audit-*.csv
          if-no-files-found: warn

      - name: Commit captured odds
        if: ${{ github.event_name == 'schedule' || github.event.inputs.commit_results == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/tennis-props/inbox/bet365-lines-*.csv || true
          git add -f data/tennis-props/inbox/bet365-tennis-market-audit-*.csv || true
          if git diff --cached --quiet; then
            echo "No tennis props odds changes to commit."
            exit 0
          fi
          git commit -m "chore: tennis props Bet365 odds refresh"
          bash scripts/ci-safe-push.sh golden-with-speed-insights
