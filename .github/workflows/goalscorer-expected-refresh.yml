name: Goalscorer Expected Refresh

on:
  schedule:
    # One bounded morning board build. Hot lineup/close refreshes are handled
    # separately and skip automatically when no fixture is due.
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      force_understat:
        description: "Re-run Understat scrape even if player-match CSVs already exist"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: golden-with-speed-insights-branch-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Create .env.local
        run: |
          : > .env.local
          if [ -n "${{ secrets.ODDS_API_KEY }}" ]; then
            echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
            echo "ODDS_API_IO_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
          fi
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          else
            echo "NEXT_PUBLIC_SUPABASE_URL=https://nuqcgzbagxtbxlqrhtvc.supabase.co" >> .env.local
          fi
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          fi
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.local
          elif [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL=${{ secrets.SUPABASE_DB_URL }}" >> .env.local
          fi

      - name: Check Understat player-log freshness
        id: understat_health
        run: |
          python scripts/goalscorer-player-log-health.py \
            --season current \
            --max-age-days 3 \
            --output "${RUNNER_TEMP}/goalscorer-player-log-health.json" \
            --github-output

      - name: Refresh stale Understat player logs
        timeout-minutes: 45
        env:
          # Only read github.event.inputs when dispatch (schedule has no inputs; avoid invalid `inputs` context).
          FORCE_UNDERSTAT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_understat == true }}
          STALE_LEAGUES: ${{ steps.understat_health.outputs.stale_leagues }}
          SEASON_LABEL: ${{ steps.understat_health.outputs.season }}
          UNDERSTAT_DELAY: "0.5"
          UNDERSTAT_REQUEST_TIMEOUT: "30"
          UNDERSTAT_MAX_ATTEMPTS: "4"
          UNDERSTAT_PLAYER_MAX_ATTEMPTS: "3"
        run: |
          if [ "${FORCE_UNDERSTAT}" = "true" ]; then
            echo "FORCE_UNDERSTAT: running Understat scrape for all configured leagues/seasons."
            python scripts/understat-scrape-serie-a.py \
              --league serie-a epl la-liga bundesliga ligue-1 \
              --season 2023-2024 2024-2025 2025-2026 \
              --delay "${UNDERSTAT_DELAY}" \
              --request-timeout "${UNDERSTAT_REQUEST_TIMEOUT}" \
              --max-attempts "${UNDERSTAT_MAX_ATTEMPTS}" \
              --player-max-attempts "${UNDERSTAT_PLAYER_MAX_ATTEMPTS}" \
              --continue-on-league-error
          elif [ -n "${STALE_LEAGUES}" ]; then
            echo "Refreshing stale current-season Understat logs: ${STALE_LEAGUES} (${SEASON_LABEL})"
            python scripts/understat-scrape-serie-a.py \
              --resume \
              --league ${STALE_LEAGUES} \
              --season "${SEASON_LABEL}" \
              --delay "${UNDERSTAT_DELAY}" \
              --request-timeout "${UNDERSTAT_REQUEST_TIMEOUT}" \
              --max-attempts "${UNDERSTAT_MAX_ATTEMPTS}" \
              --player-max-attempts "${UNDERSTAT_PLAYER_MAX_ATTEMPTS}" \
              --continue-on-league-error
          else
            echo "Goalscorer current-season player logs fresh; skipping Understat scrape."
          fi

      - name: Refresh expected lineups + public/shadow board
        run: |
          for league in serie-a epl la-liga bundesliga ligue-1; do
            echo "Running goalscorer expected refresh for ${league}"
            python scripts/run-goalscorer-pipeline.py \
              --league "${league}" \
              --live-only \
              --bookmaker Bet365 \
              --fetch-odds-api \
              --odds-api-bookmakers "Bet365" \
              --odds-api-max-http-requests 3 \
              --fetch-lineups \
              --lineup-days-ahead 3 \
              --track-shadow
          done

      - name: Build goalscorer monitor snapshot
        run: |
          python scripts/build-goalscorer-monitor-snapshot.py
          python scripts/build-football-form-layer.py --output-dir "${RUNNER_TEMP}/football-form" --skip-validation
          python scripts/generate-fair-odds-lab.py --team-match-base "${RUNNER_TEMP}/football-form/team-match-base.csv"
          python scripts/generate-fair-odds-lab-highlights.py
          python scripts/validate-fair-odds-lab-highlights.py

      - name: Upload Fair Odds Lab artifacts to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            python -m pip install vercel
          fi
          python scripts/upload-fair-odds-lab-blob.py

      - name: Upload goalscorer monitor snapshot
        env:
          ENABLE_SUPABASE_SNAPSHOT_UPLOADS: ${{ vars.ENABLE_SUPABASE_SNAPSHOT_UPLOADS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${ENABLE_SUPABASE_SNAPSHOT_UPLOADS:-0}" = "1" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            python scripts/build-goalscorer-monitor-snapshot.py --supabase
          else
            echo "::warning::Supabase snapshot upload disabled or key missing; skipping monitor snapshot upload."
          fi

      - name: Upload hosted snapshot
        env:
          ENABLE_SUPABASE_SNAPSHOT_UPLOADS: ${{ vars.ENABLE_SUPABASE_SNAPSHOT_UPLOADS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${ENABLE_SUPABASE_SNAPSHOT_UPLOADS:-0}" = "1" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            python scripts/goalscorer-live-snapshot.py --supabase
          else
            echo "::warning::Supabase snapshot upload disabled or key missing; skipping hosted snapshot upload."
          fi

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/git-add-goalscorer-deploy-artifacts.sh
          if git diff --cached --quiet; then
            echo "No goalscorer refresh changes to commit."
            exit 0
          fi
          git commit -m "chore: hosted goalscorer expected refresh"
          if ! git diff --quiet; then
            echo "Discarding non-goalscorer generated tracked changes before rebase:"
            git status --short
            git restore --worktree .
          fi
          bash scripts/ci-safe-push.sh golden-with-speed-insights
