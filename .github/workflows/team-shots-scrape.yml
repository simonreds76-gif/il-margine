name: Scoped MoviOdds cloud verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: c8228d5de28e924ffd778af7334ee7bc3684c33f
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Verify scoped key and real responses
        env:
          MOVIODDS_API_KEY: ${{ secrets.MOVIODDS_API_KEY }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import os
          from datetime import datetime, timezone
          from moviodds_prices import download, download_response, GROUPS, fresh
          from moviodds_count_prices import GROUPS as counts
          assert bool(os.environ.get('MOVIODDS_API_KEY'))
          for sport, groups in [('tennis', GROUPS['tennis']), ('soccer', counts), ('soccer', GROUPS['soccer'])]:
              board = download(sport, groups=groups)
              assert board.get('site') == 'com' and isinstance(board['matches'], list) and fresh(board['server_time'],datetime.now(timezone.utc))
              print(sport, ','.join(groups), board['site'], board['server_time'], len(board['matches']))
          match=next((m for m in board['matches'] if m.get('in_play') is False and any(str(q['group_id'])=='177703' for q in m.get('quotes',[]))),None)
          if match:
              result=download_response('https://moviodds.com/quotes',{'fi':str(match['id']),'site':'com'})
              assert result.get('site')=='com' and str(result['fixture'])==str(match['id'])
              print('fixture response',result.get('source'),result.get('server_time'))
          PY
