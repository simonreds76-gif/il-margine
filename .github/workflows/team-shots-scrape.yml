name: Team Shots Weekly Scrape

on:
  schedule:
    - cron: "7 10 * * 4" # Thursday 10:07 UTC = 11:07 BST
    - cron: "7 10 * * 5" # Friday 10:07 UTC = 11:07 BST
    - cron: "7 15 * * 5" # Friday 3:07pm UTC = 4:07pm BST
    - cron: "7 13 * * 6" # Saturday 1:07pm UTC = 2:07pm BST
    - cron: "7 13 * * 0" # Sunday 1:07pm UTC = 2:07pm BST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-props-branch-writes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Create .env.local
        run: |
          : > .env.local
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
          echo "ODDS_API_IO_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
          if [ -n "${{ secrets.THE_ODDS_API_KEY }}" ]; then
            echo "THE_ODDS_API_KEY=${{ secrets.THE_ODDS_API_KEY }}" >> .env.local
          fi

      - name: Scrape odds
        run: python scripts/team-shots-scrape-odds.py --all-leagues --bookmakers "Bet365,Unibet,William Hill,Skybet"

      - name: Archive odds
        run: python scripts/team-shots-odds-archive.py

      - name: Generate team-shots snapshot artifact
        run: python scripts/team-shots-live-snapshot.py

      - name: Upload team-shots hosted snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://nuqcgzbagxtbxlqrhtvc.supabase.co}"
            python scripts/team-shots-live-snapshot.py --supabase
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not configured; team-shots hosted snapshot upload skipped."
          fi

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/team-shots/
          if git diff --cached --quiet; then
            echo "No team-shots odds changes to commit."
            exit 0
          fi
          git commit -m "chore: weekly team shots odds scrape"
          git fetch origin golden-with-speed-insights
          git rebase origin/golden-with-speed-insights
          git push origin HEAD:golden-with-speed-insights

