name: Bookmaker Margin Snapshot

on:
  workflow_dispatch:
    inputs:
      capture_zlib_base64:
        description: Compressed public Oddschecker browser export (4–8 upcoming events)
        required: true
        type: string
      publish:
        description: Publish the validated snapshot and retain its raw evidence
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: golden-with-speed-insights-branch-writes
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: capture-tools
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          path: site
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install parser dependency
        run: pip install requests
      - name: Test capture integrity checks
        run: python capture-tools/scripts/test_bookmaker_browser_import.py
      - name: Validate and build browser snapshot
        env:
          CAPTURE_ZLIB_BASE64: ${{ inputs.capture_zlib_base64 }}
        run: python capture-tools/scripts/bookmaker-browser-import.py --repository site --output-dir "$RUNNER_TEMP/bookmaker-candidate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookmaker-margin-candidate
          path: ${{ runner.temp }}/bookmaker-candidate/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish validated snapshot
        if: inputs.publish
        working-directory: site
        run: |
          python - "$RUNNER_TEMP/bookmaker-candidate" <<'PY'
          import json, pathlib, shutil, sys
          candidate = pathlib.Path(sys.argv[1])
          data = json.loads((candidate / 'margin-index.json').read_text())
          stamp = data['generated_at'].replace(':', '').replace('-', '').replace('.', '')
          archive = pathlib.Path('data/bookmakers/captures') / stamp
          archive.mkdir(parents=True, exist_ok=True)
          shutil.copy2(candidate / 'oddschecker-capture.json', archive / 'oddschecker.json')
          shutil.copy2(candidate / 'margin-index.json', archive / 'margin-index.json')
          shutil.copy2(candidate / 'margin-index.json', 'data/bookmakers/margin-index.json')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bookmakers/margin-index.json data/bookmakers/captures
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh verified Oddschecker bookmaker snapshot'
          bash scripts/ci-safe-push.sh golden-with-speed-insights
