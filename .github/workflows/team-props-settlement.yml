name: Team Props Settlement

on:
  schedule:
    - cron: "30 23 * * *" # Nightly settlement after most match windows
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-props-branch-writes
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Settle team-shots shadow signals
        run: python scripts/team-shots-settle.py

      - name: Settle corners shortlist
        run: python scripts/shortlist-settle.py

      - name: Generate team-props snapshot artifacts
        run: |
          python scripts/team-shots-live-snapshot.py
          python scripts/corners-live-snapshot.py

      - name: Upload team-props hosted snapshots
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://nuqcgzbagxtbxlqrhtvc.supabase.co}"
            python scripts/team-shots-live-snapshot.py --supabase
            python scripts/corners-live-snapshot.py --supabase
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not configured; team-props hosted snapshot upload skipped."
          fi

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/team-shots ]; then
            git add data/team-shots/
          fi
          if [ -d data/shortlist ]; then
            git add data/shortlist/
          fi
          if [ -d data/corners-ou ]; then
            git add data/corners-ou/
          fi
          if git diff --cached --quiet; then
            echo "No settlement changes to commit."
            exit 0
          fi
          git commit -m "chore: hosted team props settlement"
          git fetch origin golden-with-speed-insights
          git rebase origin/golden-with-speed-insights
          git push origin HEAD:golden-with-speed-insights
