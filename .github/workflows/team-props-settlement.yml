name: Team Props Settlement

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-with-speed-insights-branch-writes
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Generate team-props run id
        run: echo "TEAM_PROPS_RUN_ID=$(python -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_ENV"

      - name: Generate fetch-results run id
        run: echo "FETCH_RESULTS_RUN_ID=$(python -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_ENV"

      - name: Create .env.local
        run: |
          : > .env.local
          if [ -n "${{ secrets.API_FOOTBALL_KEY }}" ]; then
            echo "API_FOOTBALL_KEY=${{ secrets.API_FOOTBALL_KEY }}" >> .env.local
          else
            echo "::warning::API_FOOTBALL_KEY not configured; results snapshot fallback coverage is reduced when Football-Data is stale and FotMob misses fixtures."
          fi
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          else
            echo "NEXT_PUBLIC_SUPABASE_URL=https://nuqcgzbagxtbxlqrhtvc.supabase.co" >> .env.local
          fi
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          fi
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.local
          elif [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL=${{ secrets.SUPABASE_DB_URL }}" >> .env.local
          fi

      - name: Start team-props run_status heartbeat
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://nuqcgzbagxtbxlqrhtvc.supabase.co}"
          python scripts/_lib/run_status_cli.py start \
            --run-id "$TEAM_PROPS_RUN_ID" \
            --pipeline team-props \
            --trigger-kind schedule

      - name: Fetch results snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://nuqcgzbagxtbxlqrhtvc.supabase.co}"
          python scripts/_lib/run_status_cli.py start \
            --run-id "$FETCH_RESULTS_RUN_ID" \
            --pipeline fetch-results-snapshot \
            --trigger-kind schedule

          set +e
          FETCH_RESULTS_SNAPSHOT_RUN_STATUS_EXTERNAL=1 python scripts/fetch-results-snapshot.py \
            --pending-path data/shortlist/settled-pnl.csv \
            --pending-path data/team-shots/shadow/team-shots-shadow-signals.csv \
            --pending-path data/football-form/team-shots-v3-ema20-clv-monitor.csv \
            --pending-path data/football-form/corners-v0-clv-monitor.csv \
            --pending-path data/football-form/team-shots-v4-shadow-clv.csv \
            --pending-path data/football-form/corners-v3-shadow-clv.csv
          fetch_status=$?
          set -e

          status="ok"
          if [ "$fetch_status" -ne 0 ]; then
            status="failed"
          fi
          python scripts/_lib/run_status_cli.py complete \
            --run-id "$FETCH_RESULTS_RUN_ID" \
            --status "$status"
          exit "$fetch_status"

      - name: Commit results snapshot before settlement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/results-snapshot ]; then
            git add data/results-snapshot/
          fi
          if git diff --cached --quiet; then
            echo "SNAPSHOT_COMMITTED=0" >> "$GITHUB_ENV"
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: results snapshot $(date -u +%Y-%m-%d)"
            echo "SNAPSHOT_COMMITTED=1" >> "$GITHUB_ENV"
          fi

      - name: Push results snapshot immediately
        if: env.SNAPSHOT_COMMITTED == '1'
        run: |
          bash scripts/ci-safe-push.sh golden-with-speed-insights

      - name: Refresh local branch after snapshot push
        if: env.SNAPSHOT_COMMITTED == '1'
        run: |
          git fetch origin golden-with-speed-insights
          git reset --hard origin/golden-with-speed-insights

      - name: Settle team-shots shadow signals
        run: python scripts/team-shots-settle.py

      - name: Settle corners shortlist
        if: always()
        run: python scripts/shortlist-settle.py

      - name: Settle football research lanes
        if: always()
        run: python scripts/settle-football-research-lanes.py

      - name: Audit settlement
        id: audit
        if: always()
        continue-on-error: true
        run: |
          python scripts/settlement_audit.py \
            data/team-shots/shadow/settlement-audit.json \
            data/shortlist/settlement-audit.json \
            data/football-form/team-shots-v3-ema20-settlement-audit.json \
            data/football-form/corners-v0-settlement-audit.json

      - name: Upload settlement audit artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: settlement-audit-${{ github.run_id }}
          path: |
            data/shortlist/settlement-audit.json
            data/team-shots/shadow/settlement-audit.json
            data/football-form/team-shots-v3-ema20-settlement-audit.json
            data/football-form/corners-v0-settlement-audit.json
          retention-days: 30

      - name: Generate team-props snapshot artifacts
        if: always()
        run: |
          python scripts/team-shots-live-snapshot.py
          python scripts/corners-live-snapshot.py

      - name: Upload team-props hosted snapshots
        if: always()
        env:
          ENABLE_SUPABASE_SNAPSHOT_UPLOADS: ${{ vars.ENABLE_SUPABASE_SNAPSHOT_UPLOADS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${ENABLE_SUPABASE_SNAPSHOT_UPLOADS:-0}" = "1" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://nuqcgzbagxtbxlqrhtvc.supabase.co}"
            python scripts/team-shots-live-snapshot.py --supabase
            python scripts/corners-live-snapshot.py --supabase
          else
            echo "::warning::Supabase snapshot upload disabled or key missing; team-props hosted snapshot upload skipped."
          fi

      - name: Commit and push if new data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/team-shots ]; then
            git add data/team-shots/
          fi
          if [ -d data/shortlist ]; then
            git add data/shortlist/
          fi
          if [ -d data/corners-ou ]; then
            git add data/corners-ou/
          fi
          if [ -d data/football-form ]; then
            git add data/football-form/
          fi
          if [ -d data/results-snapshot ]; then
            git add data/results-snapshot/
          fi
          if git diff --cached --quiet; then
            echo "No settlement changes to commit."
            exit 0
          fi
          git commit -m "chore: hosted team props settlement"
          bash scripts/ci-safe-push.sh golden-with-speed-insights

      - name: Fail workflow if settlement audit reported errors
        if: always() && steps.audit.outcome == 'failure'
        run: |
          echo "Settlement audit reported errors earlier in the run."
          exit 1

      - name: Finalize team-props run_status heartbeat
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://nuqcgzbagxtbxlqrhtvc.supabase.co}"
          status="ok"
          if [ "${{ job.status }}" != "success" ]; then
            status="failed"
          fi
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then
            status="failed"
          fi
          python scripts/_lib/run_status_cli.py complete \
            --run-id "$TEAM_PROPS_RUN_ID" \
            --status "$status"
