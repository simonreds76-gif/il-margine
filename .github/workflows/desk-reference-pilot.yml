name: Private Desk reference comparison
on:
  push:
    branches: [codex/desk-hosted-qualifying-pilot-20261121]
  workflow_dispatch:
    inputs:
      probe:
        description: 'Run a short private connection and exact-line check'
        type: boolean
        default: true
  workflow_run:
    workflows: ['Private tennis price moves']
    types: [completed]
    branches: [main]
  pull_request:
    paths: ['scripts/desk_reference_*.py', 'scripts/tests/test_desk_reference_pilot.py', '.github/workflows/desk-reference-pilot.yml']
permissions:
  contents: read
jobs:
  compare:
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') &&
       (startsWith(github.event.workflow_run.created_at, '2026-11-21') ||
        startsWith(github.event.workflow_run.created_at, '2026-11-22') ||
        startsWith(github.event.workflow_run.created_at, '2026-11-23')))
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('desk-reference-test-{0}', github.run_id) || 'desk-reference-private-pilot' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 68
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/desk_reference_*.py
            /scripts/tests/test_desk_reference_pilot.py
            /scripts/pinnradar_tennis.py
            /scripts/drop_desk_history.py
            /scripts/desk_paper_returns.py
            /scripts/price_drop_watch.py
            /scripts/desk_games.py
      - run: python -m pip install --quiet requests websocket-client==1.8.0
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts/tests -p test_desk_reference_pilot.py
      - name: Verify and retain private observations
        if: github.event_name != 'pull_request'
        env:
          REFERENCE_PROBE: ${{ (github.event_name == 'push' || inputs.probe) && 'true' || 'false' }}
          DESK_RESEARCH_FEED_ACCESS: ${{ secrets.DESK_RESEARCH_FEED_ACCESS }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/desk_reference_pilot.py
