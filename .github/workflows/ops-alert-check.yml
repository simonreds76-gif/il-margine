name: Ops Alert Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
      OPS_ALERT_IGNORE_SILENT_PIPELINES: oncourt-daily,oncourt-am-refresh,oncourt-weekly
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install psycopg2-binary
      - name: Test incident state and notification safety
        run: python -m unittest discover -s scripts/tests -p 'test_ops*.py'
      - name: Verify actual current health without notifications or writes
        run: python scripts/ops-alert-check.py --read-only
