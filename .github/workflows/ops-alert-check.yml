name: Ops Alert Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-alert-check
  cancel-in-progress: true

jobs:
  alert-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install alert-check dependency
        run: python -m pip install psycopg2-binary

      - name: Create .env.local
        run: |
          : > .env.local
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          else
            echo "NEXT_PUBLIC_SUPABASE_URL=https://nuqcgzbagxtbxlqrhtvc.supabase.co" >> .env.local
          fi
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          fi
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.local
          elif [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL=${{ secrets.SUPABASE_DB_URL }}" >> .env.local
          fi
          if [ -n "${{ secrets.OPS_ALERT_WEBHOOK_URL }}" ]; then
            echo "OPS_ALERT_WEBHOOK_URL=${{ secrets.OPS_ALERT_WEBHOOK_URL }}" >> .env.local
          fi
          if [ -n "${{ secrets.OPS_ALERT_TELEGRAM_BOT_TOKEN }}" ]; then
            echo "OPS_ALERT_TELEGRAM_BOT_TOKEN=${{ secrets.OPS_ALERT_TELEGRAM_BOT_TOKEN }}" >> .env.local
          fi
          if [ -n "${{ secrets.OPS_ALERT_TELEGRAM_CHAT_ID }}" ]; then
            echo "OPS_ALERT_TELEGRAM_CHAT_ID=${{ secrets.OPS_ALERT_TELEGRAM_CHAT_ID }}" >> .env.local
          fi
          echo "OPS_ALERT_IGNORE_SILENT_PIPELINES=oncourt-daily,oncourt-am-refresh,oncourt-weekly" >> .env.local

      - name: Log alert credential presence
        run: |
          echo "DATABASE_URL present: ${{ secrets.DATABASE_URL != '' || secrets.SUPABASE_DB_URL != '' }}"
          echo "REST creds present: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "Telegram creds present: ${{ secrets.OPS_ALERT_TELEGRAM_BOT_TOKEN != '' && secrets.OPS_ALERT_TELEGRAM_CHAT_ID != '' }}"
          echo "Webhook present: ${{ secrets.OPS_ALERT_WEBHOOK_URL != '' }}"

      - name: Check Fair Odds Lab highlights freshness
        run: python scripts/validate-fair-odds-lab-highlights.py

      - name: Check run_status alert views
        run: python scripts/ops-alert-check.py
