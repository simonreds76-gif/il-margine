name: Bookmaker Margin Index Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bookmaker-margin-index-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install capture dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Build one-off UK bookmaker snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: >-
          python scripts/bookmaker-margin-index.py
          --days-ahead 7
          --max-events 10
          --max-requests 1

      - name: Verify broad capture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/bookmakers/margin-index.json").read_text(encoding="utf-8"))
          coverage = data.get("coverage") or {}
          returned = int(coverage.get("payload_operators") or 0)
          target = int(coverage.get("target_operators") or 0)
          print(f"Margin coverage: {returned}/{target} target sportsbooks returned prices")
          if returned < 10:
              raise SystemExit("Refusing to publish: fewer than 10 sportsbooks returned prices")
          PY

      - name: Run margin-index tests
        run: python -m unittest scripts/tests/test_bookmaker_margin_index.py

      - name: Upload capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmaker-margin-index-${{ github.run_id }}
          path: data/bookmakers/margin-index.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified snapshot
        run: |
          if git diff --quiet -- data/bookmakers/margin-index.json; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bookmakers/margin-index.json
          git commit -m "data: refresh UK bookmaker margin snapshot"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
