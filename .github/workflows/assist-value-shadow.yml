name: Assist Value Shadow

on:
  # One capture per football weekend. The scheduled path is hard-capped at
  # ten odds-api.io HTTP calls and does not touch Supabase.
  schedule:
    - cron: "10 7 * * 5" # Friday 07:10 UTC; captures the weekend once.
  workflow_dispatch:
    inputs:
      refresh_role_sources:
        description: "Refresh RotoWire/FPL/SetPieceTakers source audit before scraping odds"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: golden-with-speed-insights-branch-writes
  cancel-in-progress: false

jobs:
  assist-shadow:
    # Fail closed unless explicitly enabled in repo variables.
    if: ${{ vars.ASSIST_VALUE_SHADOW_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check club-season window
        id: season
        shell: bash
        run: |
          month="$(date -u +%m)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${month}" -ge 8 ] || [ "${month}" -le 5 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Assist capture skipped outside August-May club season."
          fi

      - name: Install Python deps
        if: steps.season.outputs.active == 'true'
        run: pip install requests

      - name: Create .env.local
        if: steps.season.outputs.active == 'true'
        run: |
          : > .env.local
          if [ -n "${{ secrets.ODDS_API_KEY }}" ]; then
            echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
            echo "ODDS_API_IO_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
          fi

      - name: Run assist value shadow lane
        if: steps.season.outputs.active == 'true'
        run: |
          REFRESH_FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.refresh_role_sources }}" = "true" ]; then
            REFRESH_FLAGS="--refresh-role-sources"
          fi
          if [ "${{ github.event.schedule }}" = "10 7 * * 5" ]; then
            REFRESH_FLAGS="--refresh-role-sources"
          fi
          python scripts/run-assist-value-shadow.py ${REFRESH_FLAGS} \
            --allow-odds-failure \
            --days-ahead 3 \
            --max-events-per-league 10 \
            --max-odds-requests-per-league 1 \
            --disable-global-fallback

      - name: Fetch FotMob assist settlement data
        if: steps.season.outputs.active == 'true'
        run: |
          python scripts/fotmob-fetch-match-detail.py \
            --league epl la-liga ligue-1 serie-a bundesliga \
            --days-back 14

      - name: Settle assist value shadow signals
        if: steps.season.outputs.active == 'true'
        run: python scripts/assist-value-settle.py

      - name: Settle locked v1 prospective signals
        if: steps.season.outputs.active == 'true'
        run: |
          python scripts/assist-value-settle.py \
            --signals data/assist-value/research/assist-value-v1-prospective.csv \
            --summary data/assist-value/research/assist-value-v1-prospective-performance.txt

      - name: Rebuild assist research gates
        if: steps.season.outputs.active == 'true'
        run: python scripts/assist-value-research-gates.py

      - name: Commit and push if new shadow data
        if: steps.season.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/assist-value/assist-value-shadow-board.csv \
            data/assist-value/assist-value-shadow-report.txt \
            data/assist-value/assist-value-shadow-signals.csv \
            data/assist-value/assist-value-model-report.txt \
            data/assist-value/assist-value-shadow-performance.txt \
            data/assist-value/rotowire-setpiece-roles.csv \
            data/assist-value/rotowire-source-status.csv \
            data/assist-value/fpl-setpiece-roles.csv \
            data/assist-value/setpiecetakers-source-status.csv \
            data/assist-value/setpiece-source-audit.md \
            data/assist-value/setpiece-source-audit.json \
            data/assist-value/assist-market-audit-*.csv \
            data/assist-value/research/assist-value-market-history.csv \
            data/assist-value/research/assist-value-v1-prospective.csv \
            data/assist-value/research/assist-value-v1-prospective-performance.txt \
            data/assist-value/research/assist-value-gates.json \
            data/assist-value/research/assist-value-research-report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No assist value shadow changes to commit."
            exit 0
          fi
          git commit -m "chore: assist value shadow refresh"
          bash scripts/ci-safe-push.sh golden-with-speed-insights
