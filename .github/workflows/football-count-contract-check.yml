name: Football count contract checks
on:
  workflow_dispatch:
  pull_request:
    branches: [golden-with-speed-insights, main]
    paths:
      - 'scripts/*football*.py'
      - 'scripts/*team*shots*.py'
      - 'scripts/settlement*.py'
      - 'scripts/refresh-football-count-evidence.py'
      - 'scripts/corners_candidate_evidence.py'
      - 'scripts/tests/test_corners_candidate_evidence.py'
      - 'config/corners-evidence-rules.json'
      - 'scripts/tennis_match_shape_j1.py'
      - 'scripts/tennis_j1_rates.py'
      - 'scripts/tennis_match_winner_quotes.py'
      - 'scripts/frozen_paper_common.py'
      - 'scripts/tests/test_frozen_paper_comparisons.py'
      - 'config/*paper*.json'
      - 'config/tennis-match-shape-j1-protocol.json'
      - 'scripts/tests/test_count_identity_recovery.py'
      - 'data/team-shots/*params.json'
      - 'data/team-shots/*lock.json'
      - 'data/team-shots/*config.json'
      - 'data/team-shots/paired-reference-cohort.json'
      - 'data/team-shots/shots-market-offset-v1.json'
      - '.github/workflows/football-count-contract-check.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests numpy scipy pandas
      - name: Verify frozen paper capture and settlement isolation
        run: |
          mkdir -p outputs
          python -m unittest discover -s scripts/tests -p test_frozen_paper_comparisons.py
          python -m unittest discover -s scripts/tests -p test_shots_input_integrity.py
          python -m unittest discover -s scripts/tests -p test_football_counts_vnext_gate.py
          python -m unittest discover -s scripts/tests -p 'test_match_shape*.py'
      - name: Check identities, settlement, first prices and registered inference
        run: >-
          python -m unittest
          scripts.tests.test_football_fixture_reschedules
          scripts.tests.test_count_identity_recovery
          scripts.tests.test_team_shots_paired_reference
          scripts.tests.test_football_count_evidence_isolation
          scripts.tests.test_football_vnext_shadow
          scripts.tests.test_football_count_pending_queue
          scripts.tests.test_football_best_prices
          scripts.tests.test_team_shots_opponent_shadow
          scripts.tests.test_corners_candidate_evidence
      - name: Verify corners sidecar against current saved inputs without changing ledgers
        run: |
          mkdir -p "$RUNNER_TEMP/corners-board"
          python scripts/publish-football-vnext-shadow.py --team-output "$RUNNER_TEMP/corners-board/team.csv" --corners-output "$RUNNER_TEMP/corners-board/corners.csv" --candidates-output "$RUNNER_TEMP/corners-board/football-counts-vnext-candidates.csv"
          python scripts/corners_candidate_evidence.py --publisher-output-dir "$RUNNER_TEMP/corners-board" --output "$RUNNER_TEMP/corners-evidence"
          python scripts/corners_candidate_evidence.py --publisher-output-dir "$RUNNER_TEMP/corners-board" --output "$RUNNER_TEMP/corners-evidence"
          git diff --exit-code -- data/football-form/corners-v3-shadow-signals.csv data/football-form/corners-v3-shadow-clv.csv data/corners-ou/corners-v3-params.json data/corners-ou/corners-v3-lock.json
