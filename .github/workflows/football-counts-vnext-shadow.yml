name: Recovered Incident Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 06a96ade3e003da4e022bf9e3cead6a31545ebe4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests psycopg2-binary
      - name: Focused regression tests
        run: |
          python -m unittest discover -s scripts/tests -p 'test_ops*py' -q
          python -m unittest discover -s tests -p 'test_keeper_feed_comparison.py' -q
      - name: Read-only verification of exact production incidents
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os,sys
          from urllib.parse import urlencode
          sys.path.insert(0,'scripts')
          from ops_morning_failures import request_json
          from ops_tennis_recovery import verified_props_recovery
          base=os.environ['NEXT_PUBLIC_SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers={'apikey':key,'Authorization':'Bearer '+key}
          query=urlencode({'run_id':'eq.0a76306b-750d-40a5-a723-75d8b7ba9573','select':'run_id,status,started_at,finished_at,error_type,details'})
          rows=request_json('GET',base+'/rest/v1/run_status?'+query,headers)
          assert len(rows)==1 and rows[0]['status']=='failed'
          assert verified_props_recovery(rows[0],rows[0]['details'])
          query=urlencode({'snapshot_key':'eq.skyline_paper_v1','select':'comparison:payload->keeper_source_comparison->archive->fixtures->"5881202"'})
          rows=request_json('GET',base+'/rest/v1/goalscorer_live_snapshot?'+query,headers)
          versions=rows[0]['comparison']
          assert len(versions)>=2 and versions[0]['status']=='quarantined'
          current=versions[-1]
          assert current['status']=='reviewed_agreement'
          keeper=next(x for x in current['keepers'] if x['player_id']=='248437')
          assert set(keeper['saves'].values())=={6}
          assert keeper['event_evidence']['event_saves']==5
          assert keeper['published_count_review']['scope']=='source_comparison_only'
          print('VERIFIED: original tennis failure retained with validated recovery; Mainz published saves 6, event discrepancy 5 retained. GET-only, no Telegram or model changes.')
          PY
