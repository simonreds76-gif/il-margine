name: Football Counts vNext Shadow

on:
  schedule:
    - cron: "15 8 * * *"
    # Near-kickoff shadow capture. Detailed odds calls stay inside 90m and the
    # process-wide request cap keeps the shared free plan within budget.
    - cron: "45 9-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-with-speed-insights-branch-writes
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Seasonal gate
        id: season
        shell: bash
        run: |
          if [[ "$(date -u +%F)" < "2026-08-01" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Football vNext capture stays dormant until 2026-08-01."
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.season.outputs.active == 'true'
        with:
          ref: golden-with-speed-insights
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        if: steps.season.outputs.active == 'true'
        with:
          python-version: "3.11"

      - name: Install Python dependency
        if: steps.season.outputs.active == 'true'
        run: pip install requests

      - name: Refresh current-season count inputs
        if: steps.season.outputs.active == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '15 8 * * *')
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          python scripts/footballdata-download-historical.py --leagues epl serie-a la-liga bundesliga ligue-1 --seasons 2026 --overwrite || echo "::warning::Football-Data current-season refresh was unavailable."
          python scripts/understat-download-shots.py --leagues epl serie-a la-liga bundesliga ligue-1 --seasons 2026 || echo "::warning::Understat current-season aggregate refresh was unavailable."
          python scripts/understat-download-corner-features.py --seasons 2026 || echo "::warning::Understat corner-event refresh was unavailable."
          # The builder combines the durable archive with current-season and
          # Understat supplements. Individual lanes fail closed on missing
          # registered inputs; generic offseason league staleness is reported.
          python scripts/build-football-form-layer.py
          if [ -n "${API_FOOTBALL_KEY:-}" ]; then
            python scripts/capture-api-football-counts.py --historical-backfill --target-team-values 200 --max-requests 90 || echo "::warning::API-Football historical agreement backfill reported an error; existing archive retained."
          else
            echo "::warning::API_FOOTBALL_KEY is missing; API-Football count archive skipped."
          fi
          python scripts/api-football-source-agreement.py --allow-empty
          python scripts/fouls-fotmob-definition-agreement.py --dates-per-league 1 --allow-empty
          python scripts/fouls-definition-agreement.py --allow-empty

      - name: Capture paired market prices
        if: steps.season.outputs.active == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_KEY }}
          BETS_API_KEY: ${{ secrets.BETS_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        shell: bash
        run: |
          TEAM_ARGS=(--all-leagues --bookmakers "Bet365")
          CORNER_ARGS=()
          GK_ARGS=(--bookmaker "Bet365")
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_EXPR" != "15 8 * * *" ]]; then
            TEAM_ARGS+=(--days-ahead 1 --kickoff-within-minutes 90 --max-events-per-league 10 --max-odds-requests-per-league 1 --max-odds-api-http-requests 9)
            CORNER_ARGS+=(--bucket-hours 1 --kickoff-within-minutes 90)
            GK_ARGS+=(--days-ahead 1 --max-events 10 --kickoff-within-minutes 90 --capture-mode close)
            echo "Near-kickoff mode: detailed odds calls are limited to fixtures starting within 90 minutes."
          else
            TEAM_ARGS+=(--days-ahead 7 --max-events-per-league 20 --max-odds-requests-per-league 2 --max-odds-api-http-requests 50 --market-audit-out data/football-form/football-count-market-inventory.csv)
            CORNER_ARGS+=(--bucket-hours 6)
            GK_ARGS+=(--days-ahead 7 --max-events 10 --capture-mode publication)
            echo "Daily discovery mode: capturing publication prices for the seven-day board."
          fi
          if [ -n "${ODDS_API_KEY:-}${ODDS_API_IO_KEY:-}${BETS_API_KEY:-}" ]; then
            python scripts/team-shots-scrape-odds.py "${TEAM_ARGS[@]}"
            # v4 reads the canonical archive, not dated inbox files. Archive
            # every capture before scoring so fresh Bet365 prices are visible.
            python scripts/team-shots-odds-archive.py
            if [ -n "${ODDS_API_KEY:-}${ODDS_API_IO_KEY:-}" ]; then
              # Hard cap: one discovery request plus one /odds/multi request.
              # Predicted XIs remain blocked; only confirmed starting GKs can
              # enter the append-only shadow ledger.
              python scripts/goalkeeper-saves-capture.py "${GK_ARGS[@]}"
              python scripts/goalkeeper-saves-shadow.py
            else
              echo "::warning::Odds-API key missing; GK Saves v1 capture skipped without affecting Team Shots."
            fi
            if [[ "$EVENT_NAME" != "schedule" || "$SCHEDULE_EXPR" == "15 8 * * *" ]]; then
              python scripts/football-count-market-coverage.py
            fi
          else
            echo "::warning::No team-shots odds key; Team Shots v4 cannot emit this scan."
          fi
          # Arcadia blocks GitHub-hosted runner IPs intermittently. Keep Team
          # Shots collection alive and surface a warning; a local bounded
          # capture supplies the locked Pinnacle corners lane.
          python scripts/pinnacle-scrape-corners.py "${CORNER_ARGS[@]}" || echo "::warning::Hosted Pinnacle corners capture unavailable; local capture remains authoritative."

      - name: Score current vNext shadow board
        if: steps.season.outputs.active == 'true'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event.schedule }}" == "15 8 * * *" ]]; then
            python scripts/run-football-vnext-shadow.py
          else
            # Re-score from the just-captured near-kickoff prices. Settlement
            # and promotion gates remain on the daily full run.
            python scripts/publish-football-vnext-shadow.py
            # Refresh reason-coded scan telemetry even when the heavier daily
            # settlement stack is intentionally skipped.
            python scripts/football-counts-vnext-gate.py
          fi
          python scripts/team-shots-live-snapshot.py
          python scripts/corners-live-snapshot.py

      - name: Settle goalkeeper saves shadow evidence
        if: steps.season.outputs.active == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '15 8 * * *')
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -n "${API_FOOTBALL_KEY:-}" ]; then
            # The earlier count archive is capped at 90 calls; this settler is
            # capped at 10, preserving the registered 100-call daily ceiling.
            python scripts/goalkeeper-saves-settle.py --max-requests 10
            python scripts/goalkeeper-saves-shadow.py
          else
            echo "::warning::API_FOOTBALL_KEY missing; GK saves settlement retained pending."
          fi

      - name: Send daily football model digest
        if: steps.season.outputs.active == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '15 8 * * *')
        continue-on-error: true
        env:
          OPS_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_ALERT_TELEGRAM_BOT_TOKEN }}
          OPS_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.OPS_ALERT_TELEGRAM_CHAT_ID }}
        run: python scripts/football-daily-signal-digest.py

      - name: Commit append-only evidence
        if: steps.season.outputs.active == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event.schedule }}" == "15 8 * * *" ]]; then
            git add data/football-form/ data/team-shots/inbox/ data/team-shots/understat/ data/team-shots/team-shots-odds-history.csv data/corners-ou/pinnacle-corners-odds.csv data/goalkeeper-saves/
          else
            # Near-kickoff runs publish current candidates/signals as well as
            # the raw prices. Full settlement reports remain daily.
            git add data/team-shots/inbox/ data/team-shots/team-shots-odds-history.csv data/corners-ou/pinnacle-corners-odds.csv
            git add data/football-form/football-counts-vnext-candidates.csv
            git add data/football-form/football-counts-vnext-gate.json
            git add data/football-form/football-counts-vnext-gate.md
            git add data/football-form/team-shots-v4-shadow-signals.csv
            git add data/football-form/corners-v3-shadow-signals.csv
            git add data/team-shots/team-shots-live-snapshot.json
            git add data/corners-ou/corners-live-snapshot.json
            git add data/goalkeeper-saves/
          fi
          # These controls come from the same bounded Bet365 payload as Team
          # Shots, so retaining them adds no API calls. Stage them on both full
          # and near-kickoff runs. `-f` is required for the 1X2 CSV because the
          # broad football-form CSV ignore rule predates this evidence file.
          for evidence in \
            data/football-form/football-1x2-odds-history.csv \
            data/team-shots/match-shots-odds-history.csv \
            data/corners-ou/bet365-corners-odds-history.csv; do
            if [[ -f "$evidence" ]]; then
              git add -f "$evidence"
            fi
          done
          if git diff --cached --quiet; then
            echo "No vNext signal or evidence changes."
            exit 0
          fi
          git commit -m "chore: refresh football vnext shadow evidence"
          bash scripts/ci-safe-push.sh golden-with-speed-insights
