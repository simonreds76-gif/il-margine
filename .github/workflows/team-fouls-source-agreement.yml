name: Team Fouls Source Agreement

on:
  schedule:
    - cron: "35 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-with-speed-insights-branch-writes
  cancel-in-progress: false

jobs:
  accumulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install HTTP dependency
        run: pip install requests

      - name: Accumulate deterministic FotMob agreement sample
        run: |
          python scripts/fouls-fotmob-definition-agreement.py \
            --dates-per-league 1 \
            --target-team-values 200 \
            --target-within-one-pct 97 \
            --allow-empty
          python scripts/fouls-definition-agreement.py --allow-empty

      - name: Probe configured Bet365 foul-market feed
        if: github.event_name == 'workflow_dispatch'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -n "${ODDS_API_KEY:-}" ]; then
            python scripts/probe-odds-api-football-foul-markets.py --bookmaker Bet365 --max-events 10
          else
            echo "::warning::ODDS_API_KEY missing; foul-market probe skipped."
          fi

      - name: Commit append-only agreement evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/football-form/team-fouls-fotmob-agreement.csv \
            data/football-form/team-fouls-fotmob-agreement.json \
            data/football-form/team-fouls-fotmob-agreement.md \
            data/football-form/team-fouls-definition-agreement.json \
            data/football-form/team-fouls-definition-agreement.md
          if [ -f data/football-form/football-foul-market-probe.json ]; then
            git add \
              data/football-form/football-foul-market-probe.json \
              data/football-form/football-foul-market-probe.md
          fi
          if git diff --cached --quiet; then
            echo "FotMob agreement target already passed or no new comparable rows."
            exit 0
          fi
          git commit -m "chore: accumulate team fouls source agreement"
          bash scripts/ci-safe-push.sh golden-with-speed-insights
