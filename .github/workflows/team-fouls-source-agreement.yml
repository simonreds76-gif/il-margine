name: Manager data coverage probe (manual research branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check coach careers with at most four provider requests
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone
          key=os.environ.get('API_FOOTBALL_KEY','').strip()
          if not key: raise SystemExit('Repository secret unavailable')
          def get(path,params=None):
              url='https://v3.football.api-sports.io/'+path
              if params: url+='?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'x-apisports-key':key,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response: return json.load(response)
              except Exception as e: raise SystemExit('Request failed: '+type(e).__name__)
          status=get('status')
          quota=status.get('response',{}).get('requests',{})
          out={'checked_at':datetime.now(timezone.utc).isoformat(),'quota_before':quota,'queries':[],'calls':1}
          remaining=int(quota.get('limit_day',0))-int(quota.get('current',0))
          if status.get('errors') or remaining<10:
              out['blocked']='Status error or fewer than ten calls remaining'
          else:
              for name in ['Emery','Guardiola','Mourinho']:
                  data=get('coachs',{'search':name});out['calls']+=1
                  coaches=[{k:c.get(k) for k in ['id','name','firstname','lastname','team','career']} for c in data.get('response',[])]
                  out['queries'].append({'search':name,'errors':data.get('errors'),'coaches':coaches})
                  if data.get('errors'):break
          Path('manager-probe.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out))
          PY
      - name: Retain public career results only
        uses: actions/upload-artifact@v4
        with:
          name: manager-data-probe
          path: manager-probe.json
          retention-days: 7
