name: Manager fixture coverage probe (manual research only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe existing account with at most 4 requests
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 - <<'PY'
          """At most 20 calls; existing account only. No secret or account details in output."""
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          out = {'checked_at': datetime.now(timezone.utc).isoformat(), 'calls': 0, 'queries': [], 'publication_ready': False}
          key = os.environ.get('API_FOOTBALL_KEY', '').strip()
          class StopProbe(Exception): pass
          def get(endpoint, params=None):
              if out['calls'] >= 4: raise StopProbe('Request budget reached')
              out['calls'] += 1
              req = urllib.request.Request('https://v3.football.api-sports.io/' + endpoint + ('?' + urllib.parse.urlencode(params) if params else ''), headers={'x-apisports-key': key, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r: data = json.load(r)
              except Exception as exc: raise StopProbe('Provider request failed: ' + type(exc).__name__)
              if data.get('errors'):
                  out['queries'].append({'endpoint': endpoint, 'params': params, 'errors': data['errors']})
                  raise StopProbe('Provider error; no further requests made')
              return data.get('response')

          try:
              if not key: raise StopProbe('Existing repository secret unavailable')
              status = get('status')
              quota = status.get('requests', {})
              out['quota_before'] = quota
              out['subscription'] = {k: status.get('subscription', {}).get(k) for k in ['plan', 'active']}
              if int(quota.get('limit_day', 0)) - int(quota.get('current', 0)) < 25:
                  raise StopProbe('Insufficient quota: preserve at least five requests after probe')
              today = datetime.now(timezone.utc).date()
              season = today.year if today.month >= 7 else today.year - 1
              fixtures = get('fixtures', {'date':str(today)})
              out['queries'].append({'endpoint':'fixtures','params':{'date':str(today)},'matches_found':len(fixtures)})
              eligible=[f for f in fixtures if f.get('league',{}).get('id') in [39,140,135,78,61]]
              if eligible:
                  fixture=eligible[0]
                  fid=fixture['fixture']['id']
                  lineups=get('fixtures/lineups',{'fixture':fid})
                  out['queries'].append({'endpoint':'fixtures/lineups','fixture_id':fid,'coaches':[r.get('coach') for r in lineups]})
              out['state'] = 'completed_source_probe_requires_independent_coach_checks'
          except StopProbe as exc:
              out['state'] = 'blocked'
              out['reason'] = str(exc)
          finally:
              Path('manager-date-probe.json').write_text(json.dumps(out, indent=2))
              print(json.dumps({'state': out.get('state'), 'calls': out['calls'], 'reason': out.get('reason')}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manager-date-probe
          path: manager-date-probe.json
          retention-days: 14
