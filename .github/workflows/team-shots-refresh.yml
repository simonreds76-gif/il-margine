name: Team Shots Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-with-speed-insights-branch-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Create .env.local
        run: |
          : > .env.local
          if [ -n "${{ secrets.ODDS_API_KEY }}" ]; then
            echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
            echo "ODDS_API_IO_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
          fi
          if [ -n "${{ secrets.THE_ODDS_API_KEY }}" ]; then
            echo "THE_ODDS_API_KEY=${{ secrets.THE_ODDS_API_KEY }}" >> .env.local
          fi

      - name: Guard team-shots scrape credentials
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_KEY }}
          BETS_API_KEY: ${{ secrets.BETS_API_KEY }}
          OPS_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_ALERT_TELEGRAM_BOT_TOKEN }}
          OPS_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.OPS_ALERT_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "${ODDS_API_KEY:-}${ODDS_API_IO_KEY:-}${BETS_API_KEY:-}" ]; then
            echo "Team-shots scrape credential present."
            exit 0
          fi

          export ALERT_MESSAGE="Ops alert: team-shots scrape key missing in Team Shots Refresh. Bet365 team-shots odds scrape cannot run, so this workflow is stopping instead of publishing stale picks. Run: ${RUN_URL}"
          echo "::error::${ALERT_MESSAGE}"

          if [ -z "${OPS_ALERT_TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${OPS_ALERT_TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::Telegram ops alert credentials are missing, so the scrape-key alert could not be sent."
            exit 1
          fi

          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["OPS_ALERT_TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["OPS_ALERT_TELEGRAM_CHAT_ID"]
          text = os.environ["ALERT_MESSAGE"]
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{token}/sendMessage", data=data, timeout=20).read()
          PY
          exit 1

      - name: Refresh Football-Data historical base
        run: python scripts/footballdata-download-historical.py --leagues epl serie-a la-liga bundesliga ligue-1 --seasons 2025 --overwrite

      - name: Refresh FBRef / Understat shooting data
        run: python scripts/fbref-download-shooting.py --leagues epl serie-a la-liga bundesliga ligue-1 --seasons 2025

      - name: Build canonical football form layer
        run: python scripts/build-football-form-layer.py

      - name: Run team-shots model
        run: python scripts/team-shots-model.py

      - name: Fit team-shots calibration
        run: python scripts/team-shots-fit-calibration.py

      - name: Run team-shots v2 NB dry-run model
        run: python scripts/team-shots-model.py --prob-surface lambda_shots_nb --nb-alpha 0.25 --output data/team-shots/team-shots-predictions.v2-nb.csv --calibration data/team-shots/team-shots-calibration.v2-nb.txt

      - name: Fit team-shots v2 calibration diagnostics
        run: python scripts/team-shots-fit-calibration.py --predictions data/team-shots/team-shots-predictions.v2-nb.csv --params-out data/team-shots/team-shots-calibration-params.v2-nb.json --diag-out data/team-shots/team-shots-calibration-diagnostics.v2-nb.txt

      - name: Optional scrape + upcoming + compare + shadow
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_KEY }}
          BETS_API_KEY: ${{ secrets.BETS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -n "${ODDS_API_KEY:-}${ODDS_API_IO_KEY:-}${BETS_API_KEY:-}" ]; then
            python scripts/team-shots-scrape-odds.py --all-leagues --bookmakers "Bet365" --days-ahead 7
            python scripts/team-shots-odds-archive.py
            python scripts/team_shots_upcoming.py --days-ahead 7
            python scripts/team-shots-compare.py --min-edge 0.05
            python scripts/team-shots-shadow-tracker.py --min-edge 0.05
            python scripts/team_shots_upcoming.py --days-ahead 7 --prob-surface lambda_shots_nb --nb-alpha 0.25 --no-calibration --output data/team-shots/team-shots-upcoming.v2-nb-raw.csv --scanner data/team-shots/team-shots-scanner.v2-nb-raw.csv
            python scripts/team-shots-compare.py --predictions data/team-shots/team-shots-predictions.v2-nb.csv --upcoming data/team-shots/team-shots-upcoming.v2-nb-raw.csv --no-calibration --output data/team-shots/team-shots-comparison.v2-nb-raw.csv --summary data/team-shots/team-shots-comparison.v2-nb-raw.txt
            python scripts/team-shots-shadow-tracker.py --comparison data/team-shots/team-shots-comparison.v2-nb-raw.csv --scanner data/team-shots/team-shots-scanner.v2-nb-raw.csv --signals data/team-shots/shadow/team-shots-shadow-signals.v2-nb-raw-live-dry-run.csv --summary data/team-shots/shadow/team-shots-shadow-performance.v2-nb-raw-live-dry-run.txt --policy-version lambda-shots-nb-v2-raw --min-edge 0.12
          else
            echo "::error::No team-shots scrape key configured; guard step should have stopped this workflow before stale odds were published."
            exit 1
          fi

      - name: Settle team-shots shadow signals
        run: |
          python scripts/team-shots-settle.py
          if [ -f data/team-shots/shadow/team-shots-shadow-signals.v2-nb-raw-live-dry-run.csv ]; then
            python scripts/team-shots-settle.py --signals data/team-shots/shadow/team-shots-shadow-signals.v2-nb-raw-live-dry-run.csv --summary data/team-shots/shadow/team-shots-shadow-performance.v2-nb-raw-live-dry-run.txt --audit-out data/team-shots/shadow/settlement-audit.v2-nb-raw.json
          fi

      - name: Refresh football research pick feeds
        run: |
          python scripts/publish-football-research-picks.py
          python scripts/team-shots-v1-clv-monitor.py \
            --picks data/football-form/team-shots-v3-ema20-published-picks.csv \
            --output data/football-form/team-shots-v3-ema20-clv-monitor.csv \
            --report data/football-form/team-shots-v3-ema20-clv-monitor.md \
            --allowed-config data/football-form/team-shots-v3-ema20-allowed-leagues.json
          python scripts/corners-v0-clv-monitor.py

      - name: Settle football research lanes before snapshot
        run: python scripts/settle-football-research-lanes.py

      - name: Generate team-shots snapshot artifact
        run: python scripts/team-shots-live-snapshot.py

      - name: Upload team-shots hosted snapshot
        env:
          ENABLE_SUPABASE_SNAPSHOT_UPLOADS: ${{ vars.ENABLE_SUPABASE_SNAPSHOT_UPLOADS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${ENABLE_SUPABASE_SNAPSHOT_UPLOADS:-0}" = "1" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://nuqcgzbagxtbxlqrhtvc.supabase.co}"
            python scripts/team-shots-live-snapshot.py --supabase
          else
            echo "::warning::Supabase snapshot upload disabled or key missing; hosted team-shots snapshot upload skipped. Branch snapshot JSON will still be committed."
          fi

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/team-shots/
          git add data/football-form/
          if git diff --cached --quiet; then
            echo "No team-shots refresh changes to commit."
            exit 0
          fi
          git commit -m "chore: hosted team shots refresh"
          bash scripts/ci-safe-push.sh golden-with-speed-insights

