name: Team Shots Refresh

on:
  schedule:
    - cron: "12 17 * * 2" # Tuesday 17:12 UTC = 18:12 BST
    - cron: "12 8 * * 3"  # Wednesday 08:12 UTC = 09:12 BST
    - cron: "12 17 * * 5" # Friday 17:12 UTC = 18:12 BST
    - cron: "12 8 * * 6"  # Saturday 08:12 UTC = 09:12 BST
    - cron: "12 8 * * 0"  # Sunday 08:12 UTC = 09:12 BST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-props-branch-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Create .env.local
        run: |
          : > .env.local
          if [ -n "${{ secrets.THE_ODDS_API_KEY }}" ]; then
            echo "THE_ODDS_API_KEY=${{ secrets.THE_ODDS_API_KEY }}" >> .env.local
          fi

      - name: Refresh Football-Data historical base
        run: python scripts/footballdata-download-historical.py --leagues epl serie-a la-liga bundesliga ligue-1 --seasons 2025 --overwrite

      - name: Refresh FBRef / Understat shooting data
        run: python scripts/fbref-download-shooting.py --leagues epl serie-a la-liga bundesliga ligue-1 --seasons 2025

      - name: Run team-shots model
        run: python scripts/team-shots-model.py

      - name: Fit team-shots calibration
        run: python scripts/team-shots-fit-calibration.py

      - name: Optional upcoming + compare + shadow
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -n "${THE_ODDS_API_KEY:-}" ]; then
            python scripts/team_shots_upcoming.py --days-ahead 7
            python scripts/team-shots-compare.py --min-edge 0.05
            python scripts/team-shots-shadow-tracker.py --min-edge 0.05
          else
            echo "THE_ODDS_API_KEY not configured; skipping upcoming/compare/shadow."
          fi

      - name: Settle team-shots shadow signals
        run: python scripts/team-shots-settle.py

      - name: Generate team-shots snapshot artifact
        run: python scripts/team-shots-live-snapshot.py

      - name: Upload team-shots hosted snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://nuqcgzbagxtbxlqrhtvc.supabase.co}"
            python scripts/team-shots-live-snapshot.py --supabase
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not configured; hosted team-shots snapshot upload skipped. Branch snapshot JSON will still be committed."
          fi

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/team-shots/
          if git diff --cached --quiet; then
            echo "No team-shots refresh changes to commit."
            exit 0
          fi
          git commit -m "chore: hosted team shots refresh"
          git fetch origin golden-with-speed-insights
          git rebase origin/golden-with-speed-insights
          git push origin HEAD:golden-with-speed-insights

