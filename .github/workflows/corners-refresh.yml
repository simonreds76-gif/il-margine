name: Corners Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-with-speed-insights-branch-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Create .env.local
        run: |
          : > .env.local
          if [ -n "${{ secrets.THE_ODDS_API_KEY }}" ]; then
            echo "THE_ODDS_API_KEY=${{ secrets.THE_ODDS_API_KEY }}" >> .env.local
          fi
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          fi
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          fi

      - name: Run hosted corners refresh
        shell: pwsh
        run: |
          ./scripts/run-corners-pipeline.ps1 -SkipTeamShots -DaysAhead 7 -MinEdge 0.10 -Regions eu

      - name: Refresh football research pick feeds
        run: |
          python scripts/publish-football-research-picks.py
          python scripts/team-shots-v1-clv-monitor.py \
            --picks data/football-form/team-shots-v3-ema20-published-picks.csv \
            --output data/football-form/team-shots-v3-ema20-clv-monitor.csv \
            --report data/football-form/team-shots-v3-ema20-clv-monitor.md \
            --allowed-config data/football-form/team-shots-v3-ema20-allowed-leagues.json
          python scripts/corners-v0-clv-monitor.py

      - name: Settle football research lanes before snapshot
        run: python scripts/settle-football-research-lanes.py

      - name: Generate corners snapshot artifact
        run: python scripts/corners-live-snapshot.py

      - name: Upload corners hosted snapshot
        env:
          ENABLE_SUPABASE_SNAPSHOT_UPLOADS: ${{ vars.ENABLE_SUPABASE_SNAPSHOT_UPLOADS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${ENABLE_SUPABASE_SNAPSHOT_UPLOADS:-0}" = "1" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://nuqcgzbagxtbxlqrhtvc.supabase.co}"
            python scripts/corners-live-snapshot.py --supabase
          else
            echo "::warning::Supabase snapshot upload disabled or key missing; hosted corners snapshot upload skipped. Branch snapshot JSON will still be committed."
          fi

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/shortlist ]; then
            git add data/shortlist/
          fi
          if [ -d data/corners-ou ]; then
            git add data/corners-ou/
          fi
          if [ -d data/football-form ]; then
            git add data/football-form/
          fi
          if git diff --cached --quiet; then
            echo "No corners refresh changes to commit."
            exit 0
          fi
          git commit -m "chore: hosted corners refresh"
          bash scripts/ci-safe-push.sh golden-with-speed-insights
