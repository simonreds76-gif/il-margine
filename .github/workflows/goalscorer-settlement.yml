name: Goalscorer Settlement

on:
  schedule:
    # Morning settlement catches late La Liga kickoffs without duplicate runs.
    - cron: "45 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-with-speed-insights-branch-writes
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Create .env.local
        run: |
          : > .env.local
          if [ -n "${{ secrets.ODDS_API_KEY }}" ]; then
            echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
            echo "ODDS_API_IO_KEY=${{ secrets.ODDS_API_KEY }}" >> .env.local
          fi
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          else
            echo "NEXT_PUBLIC_SUPABASE_URL=https://nuqcgzbagxtbxlqrhtvc.supabase.co" >> .env.local
          fi
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          fi
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.local
          elif [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL=${{ secrets.SUPABASE_DB_URL }}" >> .env.local
          fi

      - name: Resolve current season
        id: season
        run: |
          month="$(date -u +%m)"
          year="$(date -u +%Y)"
          if [ "$month" -ge 7 ]; then
            start_year="$year"
          else
            start_year="$((year - 1))"
          fi
          end_year="$((start_year + 1))"
          echo "label=${start_year}-${end_year}" >> "$GITHUB_OUTPUT"

      - name: Check Understat player-log freshness
        id: understat_health
        run: |
          python scripts/goalscorer-player-log-health.py \
            --season "${{ steps.season.outputs.label }}" \
            --max-age-days 3 \
            --output "${RUNNER_TEMP}/goalscorer-player-log-health.json" \
            --github-output

      - name: Refresh stale Understat player logs
        timeout-minutes: 45
        env:
          STALE_LEAGUES: ${{ steps.understat_health.outputs.stale_leagues }}
          SEASON_LABEL: ${{ steps.understat_health.outputs.season }}
          UNDERSTAT_DELAY: "0.5"
          UNDERSTAT_REQUEST_TIMEOUT: "30"
          UNDERSTAT_MAX_ATTEMPTS: "4"
          UNDERSTAT_PLAYER_MAX_ATTEMPTS: "3"
        run: |
          if [ -n "${STALE_LEAGUES}" ]; then
            echo "Refreshing stale current-season Understat logs before settlement: ${STALE_LEAGUES} (${SEASON_LABEL})"
            python scripts/understat-scrape-serie-a.py \
              --resume \
              --league ${STALE_LEAGUES} \
              --season "${SEASON_LABEL}" \
              --delay "${UNDERSTAT_DELAY}" \
              --request-timeout "${UNDERSTAT_REQUEST_TIMEOUT}" \
              --max-attempts "${UNDERSTAT_MAX_ATTEMPTS}" \
              --player-max-attempts "${UNDERSTAT_PLAYER_MAX_ATTEMPTS}" \
              --continue-on-league-error
          else
            echo "Goalscorer current-season player logs fresh; skipping Understat scrape."
          fi

      - name: Fetch recent FotMob match detail
        run: |
          python scripts/fotmob-fetch-match-detail.py \
            --league serie-a epl la-liga bundesliga ligue-1 \
            --days-back 3
        continue-on-error: true

      - name: Build same-night FotMob penalty review
        run: |
          for league in serie-a epl la-liga bundesliga ligue-1; do
            echo "---- Build live penalty review: ${league}"
            python scripts/goalscorer-live-penalty-review.py \
              --league "${league}" \
              --days-back 6
          done
        continue-on-error: true

      - name: Settle public and shadow goalscorer signals
        run: |
          declare -A SHADOW_OUTPUTS=(
            [serie-a]="data/goalscorer/goalscorer-shadow-signals.csv"
            [epl]="data/goalscorer/epl-shadow-signals.csv"
            [la-liga]="data/goalscorer/la-liga-shadow-signals.csv"
            [bundesliga]="data/goalscorer/bundesliga-shadow-signals.csv"
            [ligue-1]="data/goalscorer/ligue-1-shadow-signals.csv"
          )
          declare -A SHADOW_SUMMARIES=(
            [serie-a]="data/goalscorer/goalscorer-shadow-performance.txt"
            [epl]="data/goalscorer/epl-shadow-performance.txt"
            [la-liga]="data/goalscorer/la-liga-shadow-performance.txt"
            [bundesliga]="data/goalscorer/bundesliga-shadow-performance.txt"
            [ligue-1]="data/goalscorer/ligue-1-shadow-performance.txt"
          )
          declare -A PUBLIC_OUTPUTS=(
            [serie-a]="data/goalscorer/goalscorer-public-signals.csv"
            [epl]="data/goalscorer/epl-public-signals.csv"
            [la-liga]="data/goalscorer/la-liga-public-signals.csv"
            [bundesliga]="data/goalscorer/bundesliga-public-signals.csv"
            [ligue-1]="data/goalscorer/ligue-1-public-signals.csv"
          )
          declare -A PUBLIC_SUMMARIES=(
            [serie-a]="data/goalscorer/goalscorer-public-performance.txt"
            [epl]="data/goalscorer/epl-public-performance.txt"
            [la-liga]="data/goalscorer/la-liga-public-performance.txt"
            [bundesliga]="data/goalscorer/bundesliga-public-performance.txt"
            [ligue-1]="data/goalscorer/ligue-1-public-performance.txt"
          )
          declare -A FAIR_ODDS_LAB_OUTPUTS=(
            [serie-a]="data/goalscorer/fair-odds-lab-serie-a-signals.csv"
            [epl]="data/goalscorer/fair-odds-lab-epl-signals.csv"
            [la-liga]="data/goalscorer/fair-odds-lab-la-liga-signals.csv"
            [bundesliga]="data/goalscorer/fair-odds-lab-bundesliga-signals.csv"
            [ligue-1]="data/goalscorer/fair-odds-lab-ligue-1-signals.csv"
          )
          declare -A FAIR_ODDS_LAB_SUMMARIES=(
            [serie-a]="data/goalscorer/fair-odds-lab-serie-a-performance.txt"
            [epl]="data/goalscorer/fair-odds-lab-epl-performance.txt"
            [la-liga]="data/goalscorer/fair-odds-lab-la-liga-performance.txt"
            [bundesliga]="data/goalscorer/fair-odds-lab-bundesliga-performance.txt"
            [ligue-1]="data/goalscorer/fair-odds-lab-ligue-1-performance.txt"
          )
          declare -A FAIR_ODDS_LAB_QUARANTINE_OUTPUTS=(
            [serie-a]="data/goalscorer/fair-odds-lab-serie-a-quarantine.csv"
            [epl]="data/goalscorer/fair-odds-lab-epl-quarantine.csv"
            [la-liga]="data/goalscorer/fair-odds-lab-la-liga-quarantine.csv"
            [bundesliga]="data/goalscorer/fair-odds-lab-bundesliga-quarantine.csv"
            [ligue-1]="data/goalscorer/fair-odds-lab-ligue-1-quarantine.csv"
          )
          declare -A FAIR_ODDS_LAB_QUARANTINE_SUMMARIES=(
            [serie-a]="data/goalscorer/fair-odds-lab-serie-a-quarantine-performance.txt"
            [epl]="data/goalscorer/fair-odds-lab-epl-quarantine-performance.txt"
            [la-liga]="data/goalscorer/fair-odds-lab-la-liga-quarantine-performance.txt"
            [bundesliga]="data/goalscorer/fair-odds-lab-bundesliga-quarantine-performance.txt"
            [ligue-1]="data/goalscorer/fair-odds-lab-ligue-1-quarantine-performance.txt"
          )

          for league in serie-a epl la-liga bundesliga ligue-1; do
            echo "---- Settle league: ${league} (shadow)"
            python scripts/goalscorer-settle.py \
              --league "${league}" \
              --signals "${SHADOW_OUTPUTS[$league]}" \
              --summary "${SHADOW_SUMMARIES[$league]}"

            echo "---- Settle league: ${league} (public)"
            python scripts/goalscorer-settle.py \
              --league "${league}" \
              --signals "${PUBLIC_OUTPUTS[$league]}" \
              --summary "${PUBLIC_SUMMARIES[$league]}"

            echo "---- Settle league: ${league} (fair odds lab exposure)"
            python scripts/goalscorer-settle.py \
              --league "${league}" \
              --signals "${FAIR_ODDS_LAB_OUTPUTS[$league]}" \
              --summary "${FAIR_ODDS_LAB_SUMMARIES[$league]}"

            quarantine_signals="${FAIR_ODDS_LAB_QUARANTINE_OUTPUTS[$league]}"
            if [ -f "${quarantine_signals}" ]; then
              echo "---- Settle league: ${league} (fair odds lab extreme-gap quarantine)"
              python scripts/goalscorer-settle.py \
                --league "${league}" \
                --signals "${quarantine_signals}" \
                --summary "${FAIR_ODDS_LAB_QUARANTINE_SUMMARIES[$league]}"
            fi
          done

      - name: Rebuild penalty review and evidence
        run: |
          declare -A PLAYER_LOGS=(
            [serie-a]="data/goalscorer/serie-a-player-match-logs-${{ steps.season.outputs.label }}.csv"
            [epl]="data/goalscorer/epl-player-match-logs-${{ steps.season.outputs.label }}.csv"
            [la-liga]="data/goalscorer/la-liga-player-match-logs-${{ steps.season.outputs.label }}.csv"
            [bundesliga]="data/goalscorer/bundesliga-player-match-logs-${{ steps.season.outputs.label }}.csv"
            [ligue-1]="data/goalscorer/ligue-1-player-match-logs-${{ steps.season.outputs.label }}.csv"
          )
          declare -A DATA_GLOBS=(
            [serie-a]="data/goalscorer/serie-a-player-match-logs-*.csv"
            [epl]="data/goalscorer/epl-player-match-logs-*.csv"
            [la-liga]="data/goalscorer/la-liga-player-match-logs-*.csv"
            [bundesliga]="data/goalscorer/bundesliga-player-match-logs-*.csv"
            [ligue-1]="data/goalscorer/ligue-1-player-match-logs-*.csv"
          )
          declare -A CONTEXT_CURRENT=(
            [serie-a]="data/goalscorer/penalty-duty-context.json"
            [epl]="data/goalscorer/epl/penalty-duty-context.json"
            [la-liga]="data/goalscorer/la-liga/penalty-duty-context.json"
            [bundesliga]="data/goalscorer/bundesliga/penalty-duty-context.json"
            [ligue-1]="data/goalscorer/ligue-1/penalty-duty-context.json"
          )
          declare -A CONTEXT_HISTORY=(
            [serie-a]="data/goalscorer/live-history/penalty-duty-context-*.json"
            [epl]="data/goalscorer/epl/live-history/penalty-duty-context-*.json"
            [la-liga]="data/goalscorer/la-liga/live-history/penalty-duty-context-*.json"
            [bundesliga]="data/goalscorer/bundesliga/live-history/penalty-duty-context-*.json"
            [ligue-1]="data/goalscorer/ligue-1/live-history/penalty-duty-context-*.json"
          )
          declare -A REVIEW_OUTPUTS=(
            [serie-a]="data/goalscorer/penalty-duty-review.csv"
            [epl]="data/goalscorer/epl-penalty-duty-review.csv"
            [la-liga]="data/goalscorer/la-liga-penalty-duty-review.csv"
            [bundesliga]="data/goalscorer/bundesliga-penalty-duty-review.csv"
            [ligue-1]="data/goalscorer/ligue-1-penalty-duty-review.csv"
          )
          declare -A REVIEW_JSON_OUTPUTS=(
            [serie-a]="data/goalscorer/penalty-duty-review.json"
            [epl]="data/goalscorer/epl-penalty-duty-review.json"
            [la-liga]="data/goalscorer/la-liga-penalty-duty-review.json"
            [bundesliga]="data/goalscorer/bundesliga-penalty-duty-review.json"
            [ligue-1]="data/goalscorer/ligue-1-penalty-duty-review.json"
          )

          for league in serie-a epl la-liga bundesliga ligue-1; do
            required_log="${PLAYER_LOGS[$league]}"
            if [ ! -f "$required_log" ]; then
              echo "SKIP: current player log missing for ${league} (${required_log})"
              continue
            fi

            echo "---- Rebuild penalty review: ${league}"
            python scripts/goalscorer-penalty-review.py \
              --context "${CONTEXT_CURRENT[$league]}" "${CONTEXT_HISTORY[$league]}" \
              --data "${DATA_GLOBS[$league]}" \
              --days-back 21 \
              --allow-empty-context \
              --output "${REVIEW_OUTPUTS[$league]}" \
              --json-output "${REVIEW_JSON_OUTPUTS[$league]}"

            echo "---- Rebuild penalty evidence: ${league}"
            python scripts/build-penalty-baseline-evidence.py --league "${league}"
          done

      - name: Build goalscorer monitor snapshot
        run: python scripts/build-goalscorer-monitor-snapshot.py

      - name: Alert new penalty review tickets
        continue-on-error: true
        env:
          OPS_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_ALERT_TELEGRAM_BOT_TOKEN }}
          OPS_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.OPS_ALERT_TELEGRAM_CHAT_ID }}
          PENALTY_REVIEW_URL: "http://localhost:3000/model-monitor/goalscorer#penalty-watchlist"
          GITHUB_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python scripts/club-penalty-review-alert.py --base-ref HEAD

      - name: Upload goalscorer monitor snapshot
        env:
          ENABLE_SUPABASE_SNAPSHOT_UPLOADS: ${{ vars.ENABLE_SUPABASE_SNAPSHOT_UPLOADS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${ENABLE_SUPABASE_SNAPSHOT_UPLOADS:-0}" = "1" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            python scripts/build-goalscorer-monitor-snapshot.py --supabase
          else
            echo "::warning::Supabase snapshot upload disabled or key missing; goalscorer monitor snapshot upload skipped."
          fi

      - name: Generate local hosted snapshot artifact
        run: |
          python scripts/goalscorer-live-snapshot.py
          python scripts/generate-fair-odds-lab-highlights.py
          python scripts/validate-fair-odds-lab-highlights.py

      - name: Upload Fair Odds Lab artifacts to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            python -m pip install vercel
          fi
          python scripts/upload-fair-odds-lab-blob.py

      - name: Upload hosted snapshot
        env:
          ENABLE_SUPABASE_SNAPSHOT_UPLOADS: ${{ vars.ENABLE_SUPABASE_SNAPSHOT_UPLOADS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${ENABLE_SUPABASE_SNAPSHOT_UPLOADS:-0}" = "1" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            python scripts/goalscorer-live-snapshot.py --supabase
          else
            echo "::warning::Supabase snapshot upload disabled or key missing; goalscorer hosted snapshot upload skipped."
          fi

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/git-add-goalscorer-deploy-artifacts.sh
          if git diff --cached --quiet; then
            echo "No goalscorer settlement changes to commit."
            exit 0
          fi
          git commit -m "chore: hosted goalscorer settlement"
          if ! git diff --quiet; then
            echo "Discarding non-goalscorer generated tracked changes before rebase:"
            git status --short
            git restore --worktree .
          fi
          bash scripts/ci-safe-push.sh golden-with-speed-insights
