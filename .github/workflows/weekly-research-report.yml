name: Reporting Reliability Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a7dc4ee7d5c7ae9997e0d3a88699b45e8e889383
          sparse-checkout: |
            scripts
            config
            .github
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests numpy scipy
      - name: Validate all weekly report renderers without collection packages
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s scripts/tests -p 'test_weekly*.py' -v
  penalty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 841cf94291a2bd2f70c63b1d5c48a3ee3efa57ab
          sparse-checkout: |
            scripts
            config
            src/data
            data/penalty-news
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Test publication guards and concurrent Git writers
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s scripts/tests -p test_penalty_news.py -v
