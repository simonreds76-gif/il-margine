name: Pinnacle Corners CLV Capture

on:
  schedule:
    - cron: "0 8,12,16,19 * * *" # 08:00, 12:00, 16:00, 19:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-props-branch-writes
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: golden-with-speed-insights
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Capture Pinnacle corners odds
        run: python scripts/pinnacle-scrape-corners.py

      - name: Generate corners snapshot artifact
        run: python scripts/corners-live-snapshot.py

      - name: Upload corners hosted snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://nuqcgzbagxtbxlqrhtvc.supabase.co}"
            python scripts/corners-live-snapshot.py --supabase
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not configured; corners hosted snapshot upload skipped."
          fi

      - name: Commit and push if new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/corners-ou/
          if git diff --cached --quiet; then
            echo "No Pinnacle corners CLV changes to commit."
            exit 0
          fi
          git commit -m "chore: capture pinnacle corners odds"
          git fetch origin golden-with-speed-insights
          git rebase origin/golden-with-speed-insights
          git push origin HEAD:golden-with-speed-insights
