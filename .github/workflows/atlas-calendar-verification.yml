name: Atlas Calendar Verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Inspect exact fixture evidence
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          python - <<'PY'
          import os,sys,json
          from datetime import datetime,timedelta,timezone
          sys.path.insert(0,'scripts')
          import football_atlas_weekly as w
          now=datetime.now(timezone.utc)
          api=w.OddsPapi(os.environ['ODDSPAPI_API_KEY'])
          rows=api.get('fixtures',tournamentId=23,**{'from':(now-timedelta(days=14)).isoformat(),'to':now.isoformat()})
          targets=[p for p in rows if p.get('fixtureId')=='id1000002371945402']
          print('Provider evidence:',json.dumps(targets))
          lid=w.legacy.LEAGUES['serie-a'][1]
          data=w.fetch_json(f'https://football.goaloo.com/jsData/matchResult/json/2026-2027/s{lid}_en.json')
          names={r[0]:r[1] for r in data['TeamInfo']}
          matches=[r for r in w.legacy.walk(data['ScheduleList']) if 'torino' in names[r[4]].lower() and 'lecce' in names[r[5]].lower()]
          print('Calendar evidence (UTC+8 source):',json.dumps(matches))
          PY
